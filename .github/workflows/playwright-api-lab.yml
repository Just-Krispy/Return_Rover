name: Playwright API Lab Tests
on:
  push:
    branches: [ main, master ]
    paths: [ 'playwright-api-lab/**' ]
  pull_request:
    branches: [ main, master ]
    paths: [ 'playwright-api-lab/**' ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-api-lab
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Verify Postman collection is in sync (regenerate = no diff)
      run: |
        npm run build:postman
        git diff --exit-code postman/ || (echo "Postman collection is out of date — run: npm run build:postman" && exit 1)
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-api-lab/playwright-report/
        retention-days: 30